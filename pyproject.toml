[project]
name = "ifcb-classification-app"
version = "0.4.0"
description = "Classify phytoplankton images with models trained by ifcb-classify"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Anders Torstensson" },
]
dependencies = [
    "gradio==6.5.1",
    "pillow==11.3.0",
    "numpy>=1.24",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
